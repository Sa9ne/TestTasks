services:
  postgres:
    image: postgres:16
    container_name: file_service_postgres
    environment:
      POSTGRES_USER: fileservice
      POSTGRES_PASSWORD: fileservice
      POSTGRES_DB: file_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileservice -d file_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
